[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "negprice"
version = "0.0.1"
description = "Day-ahead forecasting of negative electricity prices in Australia\u2019s NEM"
authors = [
  { name = "Esteban Jimenez" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "chronos-forecasting>=2.3.2",
    "holidays>=0.107",
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "nemosis>=3.8.1",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pyarrow>=26.0.0",
    "pytest",
    "python-dotenv",
    "requests>=2.34.2",
    "ruff",
    "scikit-learn",
    "torch>=2.15.0",
    "tqdm",
    "typer",
    "xgboost>=3.4.1",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["negprice"]
include = ["pyproject.toml", "negprice/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["negprice"]
force-sort-within-sections = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

